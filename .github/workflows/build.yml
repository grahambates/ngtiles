name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpng-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config libpng

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install make pkgconfiglite mingw

      - name: Set up Windows environment
        if: runner.os == 'Windows'
        run: echo "CC=gcc" >> $GITHUB_ENV

      - name: Build project
        run: make

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngtiles-${{ runner.os }}
          path: bin/ngtiles*
