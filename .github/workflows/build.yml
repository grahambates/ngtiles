name: Cross-Platform Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux Dependencies
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpng-dev

      # Skip installation on macOS (already installed on GitHub runners)
      - name: Verify dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pkg-config --modversion libpng
          echo "macOS dependencies already available."

      # Windows Dependencies (Using MSYS2)
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libpng
            make

      - name: Set up environment variables (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/mingw64/lib/pkgconfig" >> $GITHUB_ENV
          echo "PATH=/mingw64/bin:$PATH" >> $GITHUB_ENV

      - name: Test on Linux/macOS
        if: runner.os != 'Windows'
        run: make test

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

      - name: Build on Linux/macOS
        if: runner.os != 'Windows'
        run: make

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      - name: Identify and copy required DLLs (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p bin/
          # Extract required DLLs using objdump
          objdump -p bin/ngtiles.exe | grep "DLL Name" | awk '{print $3}' > dll_list.txt
          # Copy each required DLL from /mingw64/bin/ to bin/
          while IFS= read -r dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" bin/
            fi
          done < dll_list.txt

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngtiles-${{ runner.os }}
          path: bin/**
